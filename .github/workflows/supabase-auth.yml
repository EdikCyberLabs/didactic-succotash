# Réglages d'authentification du projet Supabase de l'application.
# - Connexions anonymes : chaque téléphone reçoit une identité invisible, sans e-mail ni mot de passe ;
#   ses données restent protégées par les règles de supabase/schema.sql.
# - Adresse du site web : les e-mails de confirmation et de mot de passe oublié y renvoient.
name: Supabase auth settings

on:
  push:
    paths:
      - .github/workflows/supabase-auth.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: sktrzibeinhbblnovrct
      SITE_URL: https://edikcyberlabs.github.io/didactic-succotash/
      SUPABASE_TOKEN: ${{ secrets.ACCESS_TOKEN_API_KEY || secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Anonymous sign-ins and website address
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_TOKEN" ] || { echo "::error::Secret ACCESS_TOKEN_API_KEY missing"; exit 1; }
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -n --arg site "$SITE_URL" '{external_anonymous_users_enabled: true, site_url: $site, uri_allow_list: ($site + "**")}')")
          echo "Management API: HTTP $code"
          [ "$code" -lt 300 ] || { head -c 1000 /tmp/out.json; echo; exit 1; }
          jq '{external_anonymous_users_enabled, external_email_enabled, mailer_autoconfirm, site_url, uri_allow_list}' /tmp/out.json
