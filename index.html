<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestio</title>
  <meta name="description" content="Gestion simple pour petites entreprises : ventes, achats, commandes, reçus QR et cartes de visite.">
  <meta name="theme-color" content="#5b4bff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <button class="icon-btn" id="btn-settings" aria-label="Paramètres">⚙️</button>
    </header>

    <main id="view" class="view"></main>

    <button class="fab" id="fab" aria-label="Ajouter">+</button>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active"><span>🏠</span>Accueil</button>
      <button data-tab="sales"><span>💰</span>Ventes</button>
      <button data-tab="purchases"><span>🛒</span>Achats</button>
      <button data-tab="orders"><span>📋</span>Commandes</button>
      <button data-tab="card"><span>🪪</span>Carte</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div class="toast" id="toast" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="vendor/qrcode.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
