<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kobo</title>
  <meta name="description" content="Caisse, factures, clients et finances pour toutes les entreprises.">
  <meta name="theme-color" content="#1F6BFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Écran de démarrage : affiché avant le chargement de l'application, puis retiré. -->
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-logo" src="icons/logo.svg" alt="" width="104" height="104">
    <div class="splash-name">Kobo</div>
    <div class="splash-tag">Vos comptes, simplement</div>
    <div class="splash-bar"><i></i></div>
  </div>
  <script>
    /* Animé pendant 2,5 s ; version fixe et courte si le téléphone est lent, si le système
       demande moins d'animations ou si l'utilisateur l'a choisi dans les paramètres. */
    (function () {
      var el = document.getElementById('splash');
      if (/[?&]nosplash\b/.test(location.search)) { el.parentNode.removeChild(el); return; }
      var lite = false;
      try {
        var saved = JSON.parse(localStorage.getItem('kobo.v1') || localStorage.getItem('gestio.v1') || 'null');
        lite = !!(saved && saved.settings && saved.settings.reduceMotion);
      } catch (e) { /* stockage indisponible */ }
      var system = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var weak = (navigator.deviceMemory && navigator.deviceMemory < 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
      var still = lite || system || weak;
      if (still) el.className += ' static';
      if (lite) document.documentElement.className += ' reduce-motion';
      setTimeout(function () {
        el.className += ' out';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      }, still ? 900 : 2500);
    })();
  </script>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-search" data-icon="search" aria-label="Rechercher"></button>
        <button class="icon-btn" id="btn-settings" data-icon="gear" aria-label="Paramètres"></button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <button class="fab" id="fab" data-icon="plus" aria-label="Ajouter"></button>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" data-icon="home" class="active"><span></span>Accueil</button>
      <button data-tab="pos" data-icon="pos"><span></span>Caisse</button>
      <button data-tab="sales" data-icon="coin"><span></span>Ventes</button>
      <button data-tab="clients" data-icon="user"><span></span>Clients</button>
      <button data-tab="more" data-icon="grid"><span></span>Plus</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div class="toast" id="toast" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="vendor/qrcode.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
